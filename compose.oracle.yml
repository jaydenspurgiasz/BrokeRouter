services:
  brokerouter:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BROKEROUTER_HOST: 0.0.0.0
      BROKEROUTER_DATABASE_PATH: /data/brokerouter.sqlite
    volumes:
      - brokerouter-data:/data
    networks:
      - hermes-private
    read_only: true
    tmpfs:
      - /tmp

  # Point an existing Hermes container at http://brokerouter:8787/v1.
  # Hermes is intentionally not started by this file unless you add it here.

volumes:
  brokerouter-data:

networks:
  hermes-private:
    internal: true
